services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall -d oncall"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - oncall_pg:/var/lib/postgresql/data

volumes:
  oncall_pg:
